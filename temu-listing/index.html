<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eeeee8">
  <meta name="description" content="TEMU多店铺刊登、站点库存与库龄分析">
  <title>TEMU 运营管理台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%233c5b70'/%3E%3Cpath d='M10 13h20v5h-7v14h-6V18h-7z' fill='%23f6f3e9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=ba462a7d8850">
  <script type="module" src="./app.js?v=ba462a7d8850"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="./" aria-label="运营管理台首页"><span class="brand-symbol">T</span><span>TEMU<span class="brand-sub">运营管理台</span></span></a>
    <div class="workspace"><span class="workspace-dot"></span> 丝一 · 半托管业务 <span class="workspace-tag">共享版</span></div>
    <div class="nav-label">工作空间</div>
    <nav id="navigation" aria-label="主导航">
      <button class="nav-item active" data-view="overview" aria-label="经营总览"><span class="nav-icon" aria-hidden="true">▦</span><span class="nav-text">经营总览</span><span class="nav-compact">总览</span></button>
      <button class="nav-item" data-view="matrix" aria-label="店铺上架矩阵"><span class="nav-icon" aria-hidden="true">▤</span><span class="nav-text">店铺上架矩阵</span><span class="nav-compact">店铺矩阵</span></button>
      <button class="nav-item" data-view="detail" aria-label="SKU 与库龄"><span class="nav-icon" aria-hidden="true">▧</span><span class="nav-text">SKU 与库龄</span><span class="nav-compact">SKU库龄</span></button>
      <button class="nav-item" data-view="pending" aria-label="待上架清单"><span class="nav-icon" aria-hidden="true">↗</span><span class="nav-text">待上架清单</span><span class="nav-compact">待上架</span><span id="pending-nav-count" class="nav-count"></span></button>
      <div class="nav-label">管理</div>
      <button class="nav-item" data-view="data" aria-label="数据更新与核对"><span class="nav-icon" aria-hidden="true">⇅</span><span class="nav-text">数据更新与核对</span><span class="nav-compact">数据核对</span><span id="quality-dot" class="quality-dot"></span></button>
    </nav>
    <div class="sidebar-footer"><div class="avatar">运</div><div><b>运营经理</b><small>多店铺管理工作空间</small></div></div>
  </aside>
  <div class="main-shell">
    <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <b id="breadcrumb-current">经营总览</b></div><div class="topbar-tools"><label class="reading-control">阅读字号<select id="reading-size" aria-label="阅读字号"><option value="comfortable">舒适</option><option value="large">更大</option></select></label><div class="connection"><span></span>共享数据快照</div></div></header>
    <main>
      <div class="page-heading"><div><div class="eyebrow">TEMU OPERATIONS</div><h1 id="page-title">刊登与库存总览</h1><p id="page-subtitle">从库存到上架，找到每一个待补齐的销售机会。</p></div><div class="heading-actions"><button id="export-button" class="button secondary">↓ 导出筛选结果</button><button id="update-button" hidden class="button primary">⟳ 一键更新</button></div></div>
      <div class="snapshot-line"><span class="data-dot"></span><span id="snapshot-label">正在连接数据…</span><span id="source-date" class="source-date"></span></div>
      <section class="filter-panel" id="filters" aria-label="数据筛选">
        <label>站点<select id="filter-site"><option value="">全部站点</option></select></label>
        <label>店铺<select id="filter-shop"><option value="">全部店铺</option></select></label>
        <label>品类<select id="filter-category"><option value="">全部品类</option></select></label>
        <label>上架状态<select id="filter-status"><option value="">全部状态</option><option value="active">在售</option><option value="bundle">仅组合在售</option><option value="pending">有货待上架</option><option value="unlisted">未上架</option><option value="check">待核对</option></select></label>
        <label>库存筛选<select id="filter-stock"><option value="">全部库存</option><option value="positive">有库存</option><option value="old">有超180天库存</option><option value="old365">有365天以上库存</option><option value="unknown">库存未提供／无记录</option></select></label>
        <label class="search-label">款式 / SKU / 产品名<div class="search-input"><span>⌕</span><input id="filter-search" type="search" placeholder="输入关键词" autocomplete="off"></div></label>
        <button id="reset-filters" class="reset-button">重置</button>
      </section>
      <div id="progress-panel" class="progress-panel" hidden><div><span class="spinner"></span><b id="progress-message">正在更新…</b><span id="progress-percent"></span></div><progress id="progress-bar" max="100" value="0"></progress></div>
      <div id="error-panel" class="error-panel" hidden role="alert"></div>
      <div id="app-content"><div class="loading-screen"><span class="spinner"></span><h2>正在整理产品与库存</h2><p>首次读取 Excel 需要一点时间，页面会自动显示结果。</p></div></div>
      <footer class="page-footer"><span>TEMU 运营管理台</span><span>库存按“库存池 + SKU”去重 · 数据以源表快照为准</span><button id="method-button">查看计算口径</button></footer>
    </main>
  </div>
  <dialog id="upload-dialog"><form id="upload-form"><div class="dialog-heading"><div><div class="eyebrow">DATA IMPORT</div><h2>更新源数据</h2></div><button type="button" class="close-dialog icon-button" aria-label="关闭">×</button></div><p class="muted">选择需要替换的 Excel。没有选择的源表继续使用当前版本，三份表核对通过后一起生效。</p><label class="file-field"><span><b>产品信息表</b><small>单品、组合 SKU 与款式信息</small></span><input type="file" accept=".xlsx" name="products"></label><label class="file-field"><span><b>TEMU 在售链接</b><small>单品商品与组合商品工作表</small></span><input type="file" accept=".xlsx" name="listings"></label><label class="file-field"><span><b>万邑通库龄</b><small>仓库、SKU 与五个库龄段数量</small></span><input type="file" accept=".xlsx" name="inventory"></label><div id="upload-message" class="muted" role="status"></div><div class="dialog-footer"><button type="button" class="button secondary close-dialog">取消</button><button id="upload-submit" class="button primary" type="submit">上传并更新</button></div></form></dialog>
  <dialog id="detail-dialog" class="wide-dialog"><div id="detail-content"></div></dialog>
  <dialog id="method-dialog"><div class="dialog-heading"><h2>计算口径</h2><button class="close-dialog icon-button" aria-label="关闭">×</button></div><div id="method-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
